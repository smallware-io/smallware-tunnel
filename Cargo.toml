[package]
name = "smallware-tunnel"
version = "0.1.0"
edition = "2024"
description = "Client library and CLI for establishing tunnels to Smallware tunnel server"
license = "MIT"
keywords = ["tunnel", "websocket", "proxy", "smallware"]
categories = ["network-programming", "development-tools"]
repository = "https://github.com/smallware-io/smallware-tunnel"

[profile.dev]
opt-level = 0
debug = true

[lib]
name = "smallware_tunnel"
path = "src/lib.rs"

[[bin]]
name = "smallware-tunnel"
path = "src/bin/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bytemuck = {version ="1.25.0", features = ["derive", "extern_crate_alloc"]}
bytes = "1.5"
chrono = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
coarsetime = "0.1.37"
derivative = "2.2.0"
flume = "0.11"
futures = { version = "0.3", features = ["bilock", "unstable"] }
futures-util = "0.3"
http = "1.1"
jsonwebtoken = "9.3"
parking_lot = "0.12.5"
pin-project-lite = "0.2"
procmachines = "^1.0.0"
rustls = {version = "0.23", features=["ring"]}
rustls-pemfile = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.41", features = ["full"] }
tokio-rustls = "0.26"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webpki-roots = "0.26"

[dev-dependencies]
tokio-test = "0.4"
rand = "0.8"

[[example]]
name = "live_test"
path = "examples/live_test/main.rs"
